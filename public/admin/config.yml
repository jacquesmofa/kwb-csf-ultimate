# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Sveltia CMS at https://kwb-csf.com/admin/ — editor for people with a GitHub account.
# Sign in with "Sign In Using Access Token".
# Access token: fine-grained GitHub token for jacquesmofa/kwb-csf-ultimate (Contents: read and write).
site_url: "https://kwb-csf.com"
logo_url: "https://kwb-csf.com/icon-192.png"
backend:
  name: "github"
  repo: "jacquesmofa/kwb-csf-ultimate"
  branch: "main"
media_folder: "public/media/uploads"
public_folder: "/media/uploads"
collections:
  - name: "updates"
    label: "1. Announcements"
    files:
      - name: "announcement"
        label: "Announcement (English and French)"
        file: "src/content/announcement.json"
        format: "json"
        fields:
          - name: "date"
            label: "Date"
            required: false
            widget: "datetime"
            time_format: false
            date_format: "YYYY-MM-DD"
            format: "YYYY-MM-DD"
          - name: "en"
            label: "English version"
            required: false
            widget: "object"
            fields:
              - name: "title"
                label: "Title"
                required: false
                widget: "string"
              - name: "byline"
                label: "Signed by (line under the title)"
                required: false
                widget: "string"
              - name: "greeting"
                label: "Greeting"
                required: false
                widget: "string"
              - name: "blocks"
                label: "Text blocks, in order"
                required: false
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - name: "type"
                    label: "Kind of block"
                    required: false
                    hint: "paragraph = plain text; section = heading + text; list = bullet points."
                    widget: "string"
                  - name: "text"
                    label: "Text"
                    required: false
                    widget: "text"
                  - name: "heading"
                    label: "Heading (for a section)"
                    required: false
                    widget: "string"
                  - name: "items"
                    label: "Bullet points (for a list)"
                    required: false
                    widget: "list"
                    field:
                      name: "item"
                      label: "Item"
                      required: false
                      widget: "text"
          - name: "fr"
            label: "French version"
            required: false
            widget: "object"
            fields:
              - name: "title"
                label: "Title"
                required: false
                widget: "string"
              - name: "byline"
                label: "Signed by (line under the title)"
                required: false
                widget: "string"
              - name: "greeting"
                label: "Greeting"
                required: false
                widget: "string"
              - name: "blocks"
                label: "Text blocks, in order"
                required: false
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - name: "type"
                    label: "Kind of block"
                    required: false
                    hint: "paragraph = plain text; section = heading + text; list = bullet points."
                    widget: "string"
                  - name: "text"
                    label: "Text"
                    required: false
                    widget: "text"
                  - name: "heading"
                    label: "Heading (for a section)"
                    required: false
                    widget: "string"
                  - name: "items"
                    label: "Bullet points (for a list)"
                    required: false
                    widget: "list"
                    field:
                      name: "item"
                      label: "Item"
                      required: false
                      widget: "text"
  - name: "settings"
    label: "2. Site settings (contact, social media, Google)"
    files:
      - name: "site"
        label: "Contact details and social media links"
        file: "src/content/site.json"
        format: "json"
        fields:
          - name: "name"
            label: "Name"
            required: false
            widget: "string"
          - name: "nameFr"
            label: "Name in French"
            required: false
            widget: "string"
          - name: "url"
            label: "Web address"
            required: false
            widget: "string"
          - name: "email"
            label: "Email"
            required: false
            widget: "string"
          - name: "phone"
            label: "Phone (as shown)"
            required: false
            widget: "string"
          - name: "socials"
            label: "Social media links"
            required: false
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - name: "name"
                label: "Name"
                required: false
                widget: "string"
              - name: "url"
                label: "Web address"
                required: false
                widget: "string"
              - name: "icon"
                label: "Icon name"
                required: false
                hint: "Leave as it is unless adding a new network (Remix Icon name, e.g. ri-youtube-fill)."
                widget: "string"
      - name: "seo"
        label: "Google and sharing: page titles, descriptions, pictures"
        file: "src/content/seo.json"
        format: "json"
        fields:
          - name: "site"
            label: "Whole site (defaults)"
            required: false
            widget: "object"
            fields:
              - name: "name"
                label: "Name"
                required: false
                widget: "string"
              - name: "url"
                label: "Web address"
                required: false
                widget: "string"
              - name: "image"
                label: "Share picture (1200 × 630)"
                required: false
                widget: "image"
              - name: "imageAlt"
                label: "What the picture shows (for screen readers)"
                required: false
                widget: "string"
              - name: "locale"
                label: "Main language code"
                required: false
                widget: "string"
              - name: "localeAlternate"
                label: "Second language code"
                required: false
                widget: "string"
          - name: "pages"
            label: "Pages"
            required: false
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - name: "path"
                label: "Page address"
                required: false
                hint: "For example /about. Do not change."
                widget: "string"
              - name: "title"
                label: "Title"
                required: false
                widget: "string"
              - name: "description"
                label: "Description (120 to 160 characters)"
                required: false
                widget: "text"
              - name: "image"
                label: "Share picture (1200 × 630)"
                required: false
                widget: "image"
              - name: "imageAlt"
                label: "What the picture shows (for screen readers)"
                required: false
                widget: "text"
