# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Pages CMS (https://app.pagescms.org): editor for people without a GitHub account.
media:
  input: "public/media/uploads"
  output: "/media/uploads"
  rename: "safe"
  categories:
    - "image"
    - "document"
settings:
  commit:
    identity: "user"
content:
  - name: "announcement"
    label: "Announcement (English and French)"
    type: "file"
    path: "src/content/announcement.json"
    format: "json"
    description: "The announcement shown at /announcement and in the strip on the home page. Keep the English and French versions in step."
    fields:
      - name: "date"
        label: "Date"
        type: "date"
      - name: "en"
        label: "English version"
        type: "object"
        fields:
          - name: "title"
            label: "Title"
            type: "string"
          - name: "byline"
            label: "Signed by (line under the title)"
            type: "string"
          - name: "greeting"
            label: "Greeting"
            type: "string"
          - name: "blocks"
            label: "Text blocks, in order"
            type: "object"
            list: true
            fields:
              - name: "type"
                label: "Kind of block"
                description: "paragraph = plain text; section = heading + text; list = bullet points."
                type: "string"
              - name: "text"
                label: "Text"
                type: "text"
              - name: "heading"
                label: "Heading (for a section)"
                type: "string"
              - name: "items"
                label: "Bullet points (for a list)"
                type: "text"
                list: true
      - name: "fr"
        label: "French version"
        type: "object"
        fields:
          - name: "title"
            label: "Title"
            type: "string"
          - name: "byline"
            label: "Signed by (line under the title)"
            type: "string"
          - name: "greeting"
            label: "Greeting"
            type: "string"
          - name: "blocks"
            label: "Text blocks, in order"
            type: "object"
            list: true
            fields:
              - name: "type"
                label: "Kind of block"
                description: "paragraph = plain text; section = heading + text; list = bullet points."
                type: "string"
              - name: "text"
                label: "Text"
                type: "text"
              - name: "heading"
                label: "Heading (for a section)"
                type: "string"
              - name: "items"
                label: "Bullet points (for a list)"
                type: "text"
                list: true
  - name: "site"
    label: "Contact details and social media links"
    type: "file"
    path: "src/content/site.json"
    format: "json"
    description: "Used in the footer, on the Contact page and on the announcement."
    fields:
      - name: "name"
        label: "Name"
        type: "string"
      - name: "nameFr"
        label: "Name in French"
        type: "string"
      - name: "url"
        label: "Web address"
        type: "string"
      - name: "email"
        label: "Email"
        type: "string"
      - name: "phone"
        label: "Phone (as shown)"
        type: "string"
      - name: "socials"
        label: "Social media links"
        type: "object"
        list: true
        fields:
          - name: "name"
            label: "Name"
            type: "string"
          - name: "url"
            label: "Web address"
            type: "string"
          - name: "icon"
            label: "Icon name"
            description: "Leave as it is unless adding a new network (Remix Icon name, e.g. ri-youtube-fill)."
            type: "string"
  - name: "seo"
    label: "Google and sharing: page titles, descriptions, pictures"
    type: "file"
    path: "src/content/seo.json"
    format: "json"
    description: "What Google, Facebook, WhatsApp and LinkedIn show for each page. Titles under 65 characters, descriptions under 160."
    fields:
      - name: "site"
        label: "Whole site (defaults)"
        type: "object"
        fields:
          - name: "name"
            label: "Name"
            type: "string"
          - name: "url"
            label: "Web address"
            type: "string"
          - name: "image"
            label: "Share picture (1200 × 630)"
            type: "image"
          - name: "imageAlt"
            label: "What the picture shows (for screen readers)"
            type: "string"
          - name: "locale"
            label: "Main language code"
            type: "string"
          - name: "localeAlternate"
            label: "Second language code"
            type: "string"
      - name: "pages"
        label: "Pages"
        type: "object"
        list: true
        fields:
          - name: "path"
            label: "Page address"
            description: "For example /about. Do not change."
            type: "string"
          - name: "title"
            label: "Title"
            type: "string"
          - name: "description"
            label: "Description (120 to 160 characters)"
            type: "text"
          - name: "image"
            label: "Share picture (1200 × 630)"
            type: "image"
          - name: "imageAlt"
            label: "What the picture shows (for screen readers)"
            type: "text"
